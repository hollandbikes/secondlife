name: Déployer le script Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @google/clasp@2.4.2
      - name: Sécurité - le code doit être complet
        run: |
          test -f apps-script/summary.js || { echo "summary.js absent : envoi annulé"; exit 1; }
          test -f apps-script/appsscript.json || { echo "appsscript.json absent : envoi annulé"; exit 1; }
      - name: Identifiants clasp
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.clasprc.json')));print('Identifiants lus, cles :', ', '.join(d.keys()))"
      - name: Envoyer le code
        working-directory: apps-script
        run: clasp push --force
      - name: Mettre à jour le déploiement de la webapp
        working-directory: apps-script
        run: |
          V=$(clasp version "GitHub ${GITHUB_SHA::7}" | grep -oE '[0-9]+' | tail -1)
          echo "Version créée : $V"
          clasp deploy -i "${{ secrets.DEPLOYMENT_ID }}" -V "$V" -d "GitHub ${GITHUB_SHA::7}"
